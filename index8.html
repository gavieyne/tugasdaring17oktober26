
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Gallery</title>
    <style>
        .box {
            display: inline-block;
            width: 200px;
            float: left;
            border: 2px solid #ddd;
            margin: 10px;
        }

        .box img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .box:hover {
            border: 3px solid #000;
        }

        .deskripsi {
            padding: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="box">
        <img src="assets/img/soeharto.jpeg" alt="Soeharto">
        <div class="deskripsi">Soeharto</div>
    </div>

    <div class="box">
        <img src="assets/img/Bacharuddin Jusuf Habibie.jpg" alt="Baharuddin Jusuf Habibie">
        <div class="deskripsi">Baharuddin Jusuf Habibie</div>
    </div>

    <div class="box">
        <img src="assets/img/KH abbdurrahma.jpeg" alt="Abdurrahman Wahid">
        <div class="deskripsi">KH. Abdurrahman Wahid</div>
    </div>

    <div class="box">
        <img src="assets/img/susilo.jpeg" alt="Susilo Bambang Yudhoyono">
        <div class="deskripsi">Susilo Bambang Yudhoyono</div>
    </div>

    <div class="box">
        <img src="assets/img/jokowi.jpeg" alt="Joko Widodo">
        <div class="deskripsi">Ir. H. Joko Widodo</div>
    </div>
</body>
</html>
